name: local-profile

# Runs the existing local verification profiles on Linux only. The profile selection,
# assertions and omissions belong to docs/specs/local-verification-profile-contract.md;
# this workflow executes them and never redefines them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-profile:
    name: local-profile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          # A pull_request event checks out the merge commit; the diff below needs the base too.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The harness requires Node >= 22.6 for its native TypeScript test command.
          node-version: '22.18.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Report the toolchain
        run: |
          set -euo pipefail
          node --version
          python3 --version
          git --version

      - name: Resolve the required profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push to main runs the full profile."
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed paths:"
          echo "$changed"
          # The contract makes full mandatory for runner and harness changes.
          if echo "$changed" | grep -qE '^(ticket-autopilot/scripts/|scripts/test-local)'; then
            echo "A runner or harness path changed: the full profile is mandatory."
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "No runner or harness path changed: the quick gate applies."
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the profile
        env:
          # The harness writes its raw logs under the system temporary directory; point that
          # at the runner temp so the retention step can collect them.
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node scripts/test-local.mjs "${{ steps.profile.outputs.mode }}" --report "$RUNNER_TEMP/local-profile.json"

      - name: Retain the report and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-profile-${{ steps.profile.outputs.mode || 'unresolved' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/local-profile.json
            ${{ runner.temp }}/agent-skills-tests-*/**
          if-no-files-found: warn
          retention-days: 14
