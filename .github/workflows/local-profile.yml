name: local-profile

# The existing harness owns quick/full selection, refinement and check outcomes.
# CI partitions one plan; only the final exact-coverage gate has the required name.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.profile.outputs.mode }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Report the toolchain
        run: |
          node --version
          python3 --version
          git --version
      - name: Install pinned lint dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-lint.txt
      - name: Run lint and file-size preflight
        run: npm run lint
      - name: Install modified benchmark offline dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r benchmarks/terminal-bench-4-opus55/requirements.txt
          npm ci --prefix benchmarks/terminal-bench-4-opus55
      - name: Verify modified benchmark boundaries without a provider
        working-directory: benchmarks/terminal-bench-4-opus55
        run: |
          python3 -B -m unittest discover -p 'test_*.py' -q
          node --test test_*.mjs
      - name: Verify the delivery-bench harness offline
        working-directory: benchmarks/delivery-bench
        run: python3 -B -m unittest discover -p 'test_*.py' -q
      - name: Resolve the required profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed"
          if echo "$changed" | grep -qE '^(ticket-autopilot/scripts/|scripts/(test-local|ci-profile))'; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare one refined plan
        run: node scripts/ci-profile.mjs prepare "${{ steps.profile.outputs.mode }}" "$RUNNER_TEMP/ci-plan"
      - name: Retain the plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan/manifest.json
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Profile shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Download the shared plan
        uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - name: Run only this shard
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node scripts/ci-profile.mjs run "$RUNNER_TEMP/ci-plan/manifest.json" "${{ matrix.shard }}" "$RUNNER_TEMP/ci-reports/shard-${{ matrix.shard }}.json" --timeout-seconds 900
      - name: Retain the report and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-reports/**
            ${{ runner.temp }}/agent-skills-tests-*/**
          if-no-files-found: error
          retention-days: 14

  local-profile:
    name: local-profile
    needs: [prepare, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful upstream jobs
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$CHECKS_RESULT" = success
      - name: Check out the exact candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Download the shared plan
        uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-plan
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: ci-report-*-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-results
          merge-multiple: true
      - name: Require exact complete coverage
        run: |
          node scripts/ci-profile.mjs aggregate "$RUNNER_TEMP/ci-plan/manifest.json" "$RUNNER_TEMP/ci-results/ci-reports" "$RUNNER_TEMP/local-profile.json"
      - name: Retain the aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-profile-${{ needs.prepare.outputs.mode || 'unresolved' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/local-profile.json
          if-no-files-found: warn
          retention-days: 14
